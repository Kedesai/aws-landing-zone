name: "Terraform Infrastructure"

on:
  push:
    branches:
      - main
      - feature/aws-landing-zone
  pull_request:

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: "Terraform"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Debug OIDC Token Claims
        run: |
          # Request a raw token from GitHub's internal action service
          JWT=$(curl -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          # Decode the token payload (the middle section of the JWT)
          echo "Your actual GitHub OIDC Claims are:"
          echo "$JWT" | cut -d'.' -f2 | base64 --decode | jq


      - name: Authenticate to Cloud Provider
        uses: aws-actions/configure-aws-credentials@v4 
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform Init
        run: terraform init
        working-directory: ./terraform

      - name: Terraform Format
        run: terraform fmt -check
        working-directory: ./terraform

 #     - name: Configure AWS Credentials
 #       uses: aws-actions/configure-aws-credentials@v4
 #       with:
 #         aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
 #         aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
 #         aws-region: us-east-1

      - name: Terraform Plan
        env:
          TF_VAR_billing_email: ${{ secrets.BILLING_EMAIL }}
        run: terraform plan
        working-directory: ./terraform

        
